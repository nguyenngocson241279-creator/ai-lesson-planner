<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý AI Xây dựng KHBD & Chuyển đổi số</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">✨ Trợ lý AI Xây dựng KHBD & STEM</h1>
            <p class="text-blue-100 text-sm mt-1">Hỗ trợ giáo viên Toán, Tin, KHTN, LS-ĐL thiết kế bài học chuẩn phát triển năng lực.</p>
        </div>
        
        <div class="p-6 bg-slate-50/50 border-b border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên bài học / Chủ đề</label>
                    <input type="text" id="lessonInput" value="Bài 18. Tam giác đều, Hình vuông, Lục giác đều" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Bộ môn</label>
                    <select id="subjectSelect" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white">
                        <option value="Toan">Toán học</option>
                        <option value="Tin">Tin học</option>
                        <option value="KHTN">Khoa học Tự nhiên</option>
                        <option value="LSDL">Lịch sử - Địa lý</option>
                    </select>
                </div>
            </div>
            <button onclick="generatePlan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow-md flex items-center justify-center gap-2">
                🚀 Phân tích & Đề xuất Chi tiết 3 Phương án Dạy học
            </button>
        </div>

        <div id="resultSection" class="p-6 hidden space-y-6">
            <h2 class="text-lg font-bold text-slate-800">Ma trận 3 Phương án Dạy học Chi tiết:</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="planCards"></div>
        </div>
    </div>

    <script>
        function generatePlan() {
            const name = document.getElementById('lessonInput').value;
            if(!name) { alert('Vui lòng nhập tên bài học!'); return; }
            
            const result = document.getElementById('resultSection');
            const cards = document.getElementById('planCards');
            result.classList.remove('hidden');
            
            cards.innerHTML = `
                <div class="border border-blue-200 rounded-xl p-5 bg-blue-50/20 flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-1 rounded-full">Phương án 1</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2">Digital-First (Công nghệ số & Mô phỏng)</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Sử dụng GeoGebra/PhET để trực quan hóa hình học phẳng và các góc đều.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3 rounded-lg border border-blue-100">
                            <p><strong>1. Khởi động:</strong> Trò chơi nhận diện hình ảnh qua Quizizz.</p>
                            <p><strong>2. Hình thành kiến thức:</strong> Tương tác với phần mềm GeoGebra để vẽ và đo góc tam giác đều, hình vuông, lục giác đều.</p>
                            <p><strong>3. Luyện tập:</strong> Trắc nghiệm ghép đôi tính chất.</p>
                            <p><strong>4. Vận dụng:</strong> Tìm kiếm hoa văn thực tế có chứa hình lục giác đều.</p>
                        </div>
                    </div>
                    <button onclick="alert('Đã tải xuống KHBD Phương án 1 định dạng Word!')" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 rounded-lg">📥 Tải KHBD Word (P1)</button>
                </div>

                <div class="border border-emerald-200 rounded-xl p-5 bg-emerald-50/20 flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full">Phương án 2</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2">Dự án STEM (Thiết kế Gạch hoa văn)</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Học sinh sử dụng vật liệu thủ công/tái chế để ghép hình lát mặt phẳng.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3 rounded-lg border border-emerald-100">
                            <p><strong>1. Khởi động:</strong> Quan sát mẫu gạch lát nền thực tế.</p>
                            <p><strong>2. Hình thành kiến thức:</strong> Tìm hiểu điều kiện các hình ghép khít không có khoảng trống.</p>
                            <p><strong>3. Luyện tập & STEM:</strong> Thực hành cắt ghép mô hình lục giác đều và hình vuông từ bìa cứng.</p>
                            <p><strong>4. Vận dụng:</strong> Thiết kế mẫu gạch lát sàn nghệ thuật cá nhân.</p>
                        </div>
                    </div>
                    <button onclick="alert('Đã tải xuống KHBD Phương án 2 định dạng Word!')" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded-lg">📥 Tải KHBD Word (P2)</button>
                </div>

                <div class="border border-purple-200 rounded-xl p-5 bg-purple-50/20 flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-bold text-purple-700 bg-purple-100 px-2.5 py-1 rounded-full">Phương án 3</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2">AI-Enhanced Inquiry (Tư duy phản biện)</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Sử dụng AI làm trợ lý đặt câu hỏi tranh biện và kiểm chứng cấu trúc hình học.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3 rounded-lg border border-purple-100">
                            <p><strong>1. Khởi động:</strong> Thử thách câu hỏi mở từ AI về đối xứng trong tự nhiên.</p>
                            <p><strong>2. Hình thành kiến thức:</strong> Dùng AI phân tích đặc điểm cấu trúc của tổ ong (lục giác đều).</p>
                            <p><strong>3. Luyện tập:</strong> Giải quyết bài toán tối ưu hóa diện tích.</p>
                            <p><strong>4. Vận dụng:</strong> Viết báo cáo ngắn về ứng dụng hình học trong kiến trúc.</p>
                        </div>
                    </div>
                    <button onclick="alert('Đã tải xuống KHBD Phương án 3 định dạng Word!')" class="mt-4 w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold py-2 rounded-lg">📥 Tải KHBD Word (P3)</button>
                </div>
            `;
        }
    </script>
</body>
</html>
