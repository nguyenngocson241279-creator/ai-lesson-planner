<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý AI Xây dựng KHBD & Chuyển đổi số</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">✨ Trợ lý AI Xây dựng KHBD & STEM</h1>
            <p class="text-blue-100 text-sm mt-1">Hỗ trợ giáo viên Toán, Tin, KHTN, LS-ĐL thiết kế bài học chuẩn phát triển năng lực.</p>
        </div>
        <div class="p-6 bg-slate-50/50 border-b border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên bài học / Chủ đề</label>
                    <input type="text" id="lessonInput" placeholder="Ví dụ: Định lý Pythagoras, Hệ sinh thái..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Bộ môn</label>
                    <select id="subjectSelect" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white">
                        <option value="Toan">Toán học</option>
                        <option value="Tin">Tin học</option>
                        <option value="KHTN">Khoa học Tự nhiên</option>
                        <option value="LSDL">Lịch sử - Địa lý</option>
                    </select>
                </div>
            </div>
            <button onclick="generatePlan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow-md">
                🚀 Phân tích & Đề xuất 3 Phương án Dạy học
            </button>
        </div>
        <div id="resultSection" class="p-6 hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-800">Ma trận 3 Phương án Dạy học:</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="planCards"></div>
        </div>
    </div>

    <script>
        function generatePlan() {
            const name = document.getElementById('lessonInput').value;
            if(!name) { alert('Vui lòng nhập tên bài học!'); return; }
            const result = document.getElementById('resultSection');
            const cards = document.getElementById('planCards');
            result.classList.remove('hidden');
            cards.innerHTML = `
                <div class="border p-4 rounded-xl bg-blue-50/30">
                    <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded">Phương án 1</span>
                    <h3 class="font-semibold mt-2">Digital-First (Công nghệ số)</h3>
                    <p class="text-xs text-slate-600 mt-1">Sử dụng mô phỏng PhET/GeoGebra & thực tế ảo trực quan.</p>
                </div>
                <div class="border p-4 rounded-xl bg-emerald-50/30">
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded">Phương án 2</span>
                    <h3 class="font-semibold mt-2">Dự án STEM</h3>
                    <p class="text-xs text-slate-600 mt-1">Thiết kế nguyên mẫu vật lý giải quyết vấn đề thực tiễn.</p>
                </div>
                <div class="border p-4 rounded-xl bg-purple-50/30">
                    <span class="text-xs font-bold text-purple-600 bg-purple-100 px-2 py-1 rounded">Phương án 3</span>
                    <h3 class="font-semibold mt-2">AI-Enhanced Inquiry</h3>
                    <p class="text-xs text-slate-600 mt-1">Sử dụng AI phản biện và phân tích dữ liệu nghiên cứu.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
