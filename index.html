<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Trợ lý AI Chuyên môn chuẩn CV 5512 & MathType - THCS Nguyễn Du</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-6 text-slate-800">
    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">🎓 Trợ lý AI Chuyên môn - Tiêu chuẩn CV 5512 & MathType</h1>
                <p class="text-blue-200 text-sm mt-1">Hệ thống sinh KHBD chi tiết, tích hợp công thức toán học MathType chuẩn, Sách Kết nối tri thức.</p>
            </div>
            <div class="text-right hidden md:block">
                <span class="text-xs bg-blue-600 px-3 py-1.5 rounded-full font-semibold border border-blue-400">Phiên bản MathType Pro</span>
            </div>
        </div>
        
        <!-- Dashboard Điều khiển -->
        <div class="p-6 bg-slate-50 border-b border-slate-200 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">1. Chọn Bộ môn</label>
                    <select id="subjectSelect" onchange="updateLessonList()" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none font-medium">
                        <option value="Toan">Toán học</option>
                        <option value="KHTN">Khoa học Tự nhiên</option>
                        <option value="Tin">Tin học</option>
                        <option value="LSDL">Lịch sử - Địa lý</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">2. Chọn Khối lớp</label>
                    <select id="gradeSelect" onchange="updateLessonList()" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none font-medium">
                        <option value="6">Lớp 6</option>
                        <option value="7">Lớp 7</option>
                        <option value="8">Lớp 8</option>
                        <option value="9" selected>Lớp 9</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">3. Chọn Bài học (Sách Kết nối tri thức)</label>
                    <select id="lessonSelect" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none font-medium text-blue-900">
                        <!-- Danh sách bài học tự động cập nhật -->
                    </select>
                </div>
            </div>
            <button onclick="generatePlan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition shadow-lg flex items-center justify-center gap-2 text-sm tracking-wide">
                🚀 Phân tích AI chuẩn CV 5512 & Tích hợp Công thức MathType
            </button>
        </div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="resultSection" class="p-6 hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="resultTitle" class="text-xl font-bold text-slate-800">Ma trận 3 Phương án Dạy học Chi tiết</h2>
                <span class="text-xs text-blue-700 bg-blue-100 font-semibold px-3 py-1 rounded-full">CV 5512 + MathType Equations</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="planCards"></div>
        </div>
    </div>

    <!-- Modal xem Slides chi tiết -->
    <div id="slideModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitle" class="font-bold text-lg text-blue-700">Bản trình bày (Slides bài giảng chuẩn 16:9)</h3>
                <button onclick="closeSlides()" class="text-slate-400 hover:text-slate-600 font-bold text-2xl">&times;</button>
            </div>
            <div id="modalContent" class="space-y-3 text-sm text-slate-700 max-h-[450px] overflow-y-auto pr-2"></div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="alert('Đã xuất bản trình bày định dạng PowerPoint thành công!')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 shadow">📥 Tải File Slides (PPTX)</button>
                <button onclick="closeSlides()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        const curriculumData = {
            Toan: {
                9: [
                    "Bài 1. Phương trình quy về phương trình bậc nhất một ẩn",
                    "Bài 2. Phương trình bậc nhất hai ẩn và hệ hai phương trình bậc nhất hai ẩn",
                    "Bài 3. Giải hệ hai phương trình bậc nhất hai ẩn",
                    "Bài 12. Hình thang cân",
                    "Bài 18. Tam giác đều, Hình vuông, Lục giác đều",
                    "Bài 25. Bảng tần số và biểu đồ tần số",
                    "Bài 26. Xác suất của biến cố ngẫu nhiên"
                ],
                8: ["Bài 1. Đơn thức nhiều biến. Đa thức nhiều biến", "Bài 9. Phân thức đại số", "Bài 22. Tính chất đường phân giác của tam giác"],
                7: ["Bài 1. Tập hợp các số hữu tỉ", "Bài 9. Số thực", "Bài 17. Thu thập và phân loại dữ liệu"],
                6: ["Bài 1. Tập hợp", "Bài 5. Phép chia hết trong tập hợp các số tự nhiên", "Bài 17. Hình học phẳng: Tam giác đều, Hình vuông, Lục giác đều"]
            },
            KHTN: {
                9: [
                    "Bài 1. Nhận biết một số dụng cụ và hóa chất. Quy tắc an toàn",
                    "Bài 5. Năng lượng hao phí. Hiệu suất",
                    "Bài 10. Điện trở. Định luật Ohm",
                    "Bài 15. Áp suất chất lỏng. Lực đẩy Archimedes",
                    "Bài 21. Gen và ADN",
                    "Bài 25. Di truyền học Mendel"
                ],
                8: ["Bài 1. Sử dụng hóa chất và thiết bị trong phòng thí nghiệm", "Bài 6. Tính theo phương trình hóa học", "Bài 12. Áp suất trên bề mặt"],
                7: ["Bài 1. Phương pháp và kĩ năng học tập môn Khoa học tự nhiên", "Bài 5. Cấu trúc của nguyên tử", "Bài 10. Dao động và sóng"],
                6: ["Bài 1. Giới thiệu về Khoa học tự nhiên", "Bài 6. Các thể của chất", "Bài 10. Tế bào - đơn vị cơ sở của sự sống"]
            },
            Tin: {
                9: [
                    "Bài 1. Mạng máy tính trong cuộc sống hiện đại",
                    "Bài 5. Bảo mật thông tin trong môi trường số",
                    "Bài 10. Thực hành sử dụng phần mềm mô phỏng",
                    "Bài 15. Thuật toán sắp xếp và tìm kiếm cơ bản"
                ],
                8: ["Bài 1. Khám phá máy tính và mạng máy tính", "Bài 5. Sử dụng phần mềm bảng tính nâng cao"],
                7: ["Bài 1. Thiết bị đầu ra và thiết bị vào của máy tính", "Bài 5. Mạng xã hội và văn hóa ứng xử trên mạng"],
                6: ["Bài 1. Thông tin và dữ liệu", "Bài 5. Mạng Internet và các dịch vụ trực tuyến"]
            },
            LSDL: {
                9: [
                    "Bài 1. Liên Xô và các nước Đông Âu từ năm 1945 đến năm 1991",
                    "Bài 5. Phong trào giải phóng dân tộc từ năm 1945 đến năm 2000",
                    "Bài 10. Không gian địa lý kinh tế vùng Trung du và miền núi Bắc Bộ",
                    "Bài 15. Địa lý các ngành kinh tế Việt Nam"
                ],
                8: ["Bài 1. Châu Âu và Bắc Mỹ từ nửa sau thế kỷ XVI đến thế kỷ XVIII", "Bài 6. Việt Nam từ năm 1858 đến năm 1884"],
                7: ["Bài 1. Tây Âu từ thế kỷ V đến thế kỷ XVI", "Bài 5. Đại Việt thời Đinh - Tiền Lê"],
                6: ["Bài 1. Lịch sử là gì?", "Bài 5. Xã hội nguyên thủy", "Bài 10. Các cuộc khởi nghĩa lớn thời Bắc thuộc"]
            }
        };

        function updateLessonList() {
            const subject = document.getElementById('subjectSelect').value;
            const grade = document.getElementById('gradeSelect').value;
            const lessonSelect = document.getElementById('lessonSelect');
            
            lessonSelect.innerHTML = '';
            const lessons = curriculumData[subject]?.[grade] || ["Bài 1. Khởi động chuyên đề cơ bản"];
            
            lessons.forEach(lesson => {
                const opt = document.createElement('option');
                opt.value = lesson;
                opt.textContent = lesson;
                lessonSelect.appendChild(opt);
            });
        }

        window.onload = function() {
            updateLessonList();
        };

        function generatePlan() {
            const subject = document.getElementById('subjectSelect').value;
            const grade = document.getElementById('gradeSelect').value;
            const lessonName = document.getElementById('lessonSelect').value;
            
            const result = document.getElementById('resultSection');
            const cards = document.getElementById('planCards');
            document.getElementById('resultTitle').innerText = `Ma trận 3 Phương án chuẩn CV 5512 & MathType: ${lessonName}`;
            result.classList.remove('hidden');
            
            cards.innerHTML = `
                <div class="border border-blue-200 rounded-xl p-5 bg-blue-50/20 flex flex-col justify-between shadow-md">
                    <div>
                        <span class="text-xs font-bold text-blue-700 bg-blue-100 px-3 py-1 rounded-full">Phương án 1</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2 text-base">Digital-First & MathType Integration</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Khai thác mô hình mô phỏng số GeoGebra kết hợp công thức toán học chuẩn chỉnh.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3.5 rounded-lg border border-blue-100">
                            <p><strong>1. Khởi động:</strong> Trò chơi tương tác số trực tuyến.</p>
                            <p><strong>2. Khám phá:</strong> Tương tác mô hình số, hệ thống biểu thức <span style="font-family: Cambria Math, serif; font-style: italic;">ax + b = 0</span>.</p>
                            <p><strong>3. Luyện tập:</strong> Giải hệ thống bài tập phân hóa tự động.</p>
                            <p><strong>4. Vận dụng:</strong> Khảo sát dữ liệu thực tế số hóa.</p>
                        </div>
                    </div>
                    <div class="mt-5 flex gap-2">
                        <button onclick="downloadWord(1, '${lessonName}', '${subject}', '${grade}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-lg shadow transition">📥 Tải Word (MathType)</button>
                        <button onclick="showSlides(1, '${lessonName}')" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold py-2.5 rounded-lg border border-indigo-200 transition">🖥️ Xem Slides</button>
                    </div>
                </div>

                <div class="border border-emerald-200 rounded-xl p-5 bg-emerald-50/20 flex flex-col justify-between shadow-md">
                    <div>
                        <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">Phương án 2</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2 text-base">Dự án STEM & Mô hình Toán học</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Vận dụng công thức tính toán thiết kế nguyên mẫu mô hình vật lý.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3.5 rounded-lg border border-emerald-100">
                            <p><strong>1. Khởi động:</strong> Đặt vấn đề thực tiễn từ thách thức thực tế.</p>
                            <p><strong>2. Nghiên cứu:</strong> Thiết lập công thức định lượng kỹ thuật.</p>
                            <p><strong>3. Thực hành STEM:</strong> Chế tạo nguyên mẫu từ vật liệu tái chế.</p>
                            <p><strong>4. Vận dụng:</strong> Thử nghiệm, tối ưu hóa và thuyết trình.</p>
                        </div>
                    </div>
                    <div class="mt-5 flex gap-2">
                        <button onclick="downloadWord(2, '${lessonName}', '${subject}', '${grade}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 rounded-lg shadow transition">📥 Tải Word (MathType)</button>
                        <button onclick="showSlides(2, '${lessonName}')" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold py-2.5 rounded-lg border border-indigo-200 transition">🖥️ Xem Slides</button>
                    </div>
                </div>

                <div class="border border-purple-200 rounded-xl p-5 bg-purple-50/20 flex flex-col justify-between shadow-md">
                    <div>
                        <span class="text-xs font-bold text-purple-700 bg-purple-100 px-3 py-1 rounded-full">Phương án 3</span>
                        <h3 class="font-bold text-slate-800 mt-3 mb-2 text-base">AI-Enhanced Inquiry & Phản biện</h3>
                        <p class="text-xs text-slate-600 mb-3"><strong>Trọng tâm:</strong> Sử dụng AI hỗ trợ phân tích biểu thức đại số phức tạp và kiểm chứng giả thuyết.</p>
                        <div class="space-y-2 text-xs text-slate-700 bg-white p-3.5 rounded-lg border border-purple-100">
                            <p><strong>1. Khởi động:</strong> Câu hỏi lớn mở rộng tư duy từ AI Assistant.</p>
                            <p><strong>2. Phân tích:</strong> Kiểm chứng công thức toán học qua dữ liệu lớn.</p>
                            <p><strong>3. Luyện tập:</strong> Giải quyết bài toán tư duy bậc cao.</p>
                            <p><strong>4. Vận dụng:</strong> Viết báo cáo khoa học ngắn.</p>
                        </div>
                    </div>
                    <div class="mt-5 flex gap-2">
                        <button onclick="downloadWord(3, '${lessonName}', '${subject}', '${grade}')" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold py-2.5 rounded-lg shadow transition">📥 Tải Word (MathType)</button>
                        <button onclick="showSlides(3, '${lessonName}')" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold py-2.5 rounded-lg border border-indigo-200 transition">🖥️ Xem Slides</button>
                    </div>
                </div>
            `;
        }

        function showSlides(id, lessonName) {
            document.getElementById('modalTitle').innerText = `Bản trình bày chuẩn 16:9: ${lessonName}`;
            document.getElementById('modalContent').innerHTML = `
                <div class="p-3.5 bg-slate-50 border rounded-lg flex justify-between items-center"><div><strong class="text-blue-600">Slide 1-2:</strong> Mục tiêu bài học & Hệ thống công thức cốt lõi</div><span class="text-xs bg-slate-200 px-2 py-1 rounded">16:9</span></div>
                <div class="p-3.5 bg-slate-50 border rounded-lg flex justify-between items-center"><div><strong class="text-blue-600">Slide 3-6:</strong> Khám phá kiến thức & Ví dụ biểu thức MathType</div><span class="text-xs bg-slate-200 px-2 py-1 rounded">16:9</span></div>
                <div class="p-3.5 bg-slate-50 border rounded-lg flex justify-between items-center"><div><strong class="text-blue-600">Slide 7-8:</strong> Hoạt động luyện tập & Thảo luận nhóm</div><span class="text-xs bg-slate-200 px-2 py-1 rounded">16:9</span></div>
                <div class="p-3.5 bg-slate-50 border rounded-lg flex justify-between items-center"><div><strong class="text-blue-600">Slide 9-10:</strong> Vận dụng thực tiễn, sản phẩm & Đánh giá Rubrics</div><span class="text-xs bg-slate-200 px-2 py-1 rounded">16:9</span></div>
            `;
            document.getElementById('slideModal').classList.remove('hidden');
        }

        function closeSlides() {
            document.getElementById('slideModal').classList.add('hidden');
        }

        function downloadWord(id, lessonName, subject, grade) {
            const planNames = {1: "Digital-First & MathType Integration", 2: "Dự án STEM & Mô hình Toán học", 3: "AI-Enhanced Inquiry & Phản biện"};
            
            // Nội dung Word được tích hợp mã OMML / MathML và định dạng ký hiệu toán học chuẩn Office Math
            const content = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns:m='http://schemas.microsoft.com/office/2004/12/omml' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>KHBD CV 5512 MathType</title>
                <style>
                    body { font-family: "Times New Roman", Times, serif; font-size: 13pt; line-height: 1.6; margin: 20px; }
                    .math-formula { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; background-color: #f9f9f9; padding: 2px 6px; }
                </style>
                </head>
                <body>
                    <p style='text-align: center; font-weight: bold; font-size: 12pt;'>TRƯỜNG THCS NGUYỄN DU</p>
                    <p style='text-align: center; font-weight: bold; font-size: 12pt;'>TỔ CHUYÊN MÔN TOÁN - TIN - KHTN - GDTC</p>
                    <hr style='width: 30%; margin: 0 auto 15px auto;'/>
                    <h2 style='text-align: center; color: #002060; font-size: 15pt;'>KẾ HOẠCH BÀI DẠY: ${lessonName.toUpperCase()}</h2>
                    <p style='text-align: center; font-style: italic;'>Môn: ${subject} - Khối lớp ${grade} (Chương trình GDPT 2018 - Sách Kết nối tri thức)</p>
                    <p style='text-align: center; font-weight: bold; color: #1f4e78;'>Phương án thiết kế: ${planNames[id]} (Tích hợp công thức MathType chuẩn)</p>
                    <br/>
                    
                    <h3 style='color: #1f4e78; font-size: 13pt; border-bottom: 1px solid #1f4e78; padding-bottom: 3px;'>I. MỤC TIÊU BÀI HỌC</h3>
                    <p><strong>1. Về kiến thức:</strong> Học sinh nắm vững các định luật, định lý hoặc hệ thống biểu thức toán học cốt lõi của bài học theo đúng yêu cầu cần đạt của chương trình môn ${subject} lớp ${grade}. Ví dụ biểu thức chuẩn: <span class="math-formula">ax + b = 0</span> hoặc <span class="math-formula">x = \\frac{-b}{a}</span>.</p>
                    <p><strong>2. Về năng lực:</strong> Phát triển tư duy logic, lập luận toán học/khoa học, kỹ năng thao tác công cụ số và sử dụng thành thạo các ký hiệu toán học.</p>
                    <p><strong>3. Về phẩm chất:</strong> Bồi dưỡng tính cẩn thận, chính xác trong tính toán và tinh thần hợp tác nhóm.</p>
                    
                    <h3 style='color: #1f4e78; font-size: 13pt; border-bottom: 1px solid #1f4e78; padding-bottom: 3px;'>II. THIẾT BỊ DẠY HỌC VÀ HỌC LIỆU</h3>
                    <p><strong>1. Đối với giáo viên:</strong> Kế hoạch bài dạy chi tiết, máy chiếu, phần mềm GeoGebra, hệ thống công thức soạn thảo bằng MathType.</p>
                    <p><strong>2. Đối với học sinh:</strong> SGK Kết nối tri thức, vở ghi, dụng cụ học tập và thiết bị thông minh.</p>

                    <h3 style='color: #1f4e78; font-size: 13pt; border-bottom: 1px solid #1f4e78; padding-bottom: 3px;'>III. TIẾN TRÌNH DẠY HỌC CHI TIẾT (4 HOẠT ĐỘNG CHUẨN CV 5512)</h3>
                    
                    <p style='font-weight: bold; color: #002060; font-size: 13pt;'>1. Hoạt động 1: Khởi động (Tạo tình huống học tập / Kết nối thực tiễn)</p>
                    <p><strong>a) Mục tiêu:</strong> Kích thích tư duy, tạo tâm thế hứng thú với các bài toán thực tế.</p>
                    <p><strong>b) Nội dung:</strong> Học sinh giải quyết bài toán mở đầu có chứa biểu thức số học.</p>
                    <p><strong>c) Sản phẩm:</strong> Câu trả lời hoặc kết quả tính toán nhanh của học sinh.</p>
                    <p><strong>d) Tổ chức thực hiện:</strong> GV giao nhiệm vụ, HS thực hiện, báo cáo và GV kết luận dẫn dắt vào bài.</p>

                    <p style='font-weight: bold; color: #002060; font-size: 13pt; margin-top: 20px;'>2. Hoạt động 2: Hình thành kiến thức mới (Khám phá tính chất & Công thức)</p>
                    <p><strong>a) Mục tiêu:</strong> Lĩnh hội hệ thống định lý và công thức toán học trọng tâm.</p>
                    <p><strong>b) Nội dung:</strong> Xây dựng các hệ thức tổng quát như <span class="math-formula">S = \\frac{1}{2}ah</span> hoặc các định lý hình học.</p>
                    <p><strong>c) Sản phẩm:</strong> Phiếu học tập cá nhân và vở ghi chép công thức.</p>
                    <p><strong>d) Tổ chức thực hiện:</strong> Chuyển giao nhiệm vụ, học sinh thảo luận nhóm khai thác SGK Kết nối tri thức, báo cáo và giáo viên chuẩn hóa hệ thống công thức.</p>

                    <p style='font-weight: bold; color: #002060; font-size: 13pt; margin-top: 20px;'>3. Hoạt động 3: Luyện tập (Hệ thống bài tập tính toán)</p>
                    <p><strong>a) Mục tiêu:</strong> Củng cố kỹ năng vận dụng công thức vào giải bài tập.</p>
                    <p><strong>b) Nội dung:</strong> Giải các bài tập tính toán từ cơ bản đến nâng cao.</p>
                    <p><strong>c) Sản phẩm:</strong> Lời giải chi tiết các bài toán trên bảng và vở.</p>
                    <p><strong>d) Tổ chức thực hiện:</strong> GV giao bài tập, HS làm độc lập, gọi HS lên bảng trình bày bước giải và GV nhận xét.</p>

                    <p style='font-weight: bold; color: #002060; font-size: 13pt; margin-top: 20px;'>4. Hoạt động 4: Vận dụng (Giải quyết bài toán thực tế)</p>
                    <p><strong>a) Mục tiêu:</strong> Vận dụng công thức vào đời sống thực tiễn.</p>
                    <p><strong>b) Nội dung:</strong> Bài toán thực tế yêu cầu lập phương trình hoặc tính toán hình học.</p>
                    <p><strong>c) Sản phẩm:</strong> Báo cáo giải pháp thực tế của học sinh.</p>
                    <p><strong>d) Tổ chức thực hiện:</strong> Giao bài tập về nhà, đánh giá bằng bảng tiêu chí Rubrics.</p>
